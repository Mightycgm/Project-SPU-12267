    <style>
      /* เพิ่ม Smooth Scroll ให้เลื่อนนุ่มๆ */
      html {
        scroll-behavior: smooth;
      }

      /* 1. Default Variables (Dark Mode เป็นค่าเริ่มต้น) */
      :root {
        --bs-danger: #6b0000;
        --main-bg-gradient-start: #6b0000;
        --main-bg-gradient-end: #000000;
        --card-bg: #000000;
        --text-color: #ffffff;
        --theme-btn-color: #ffffff; 
        --shop-btn-bg: #ffffff;
        --shop-btn-text: #000000;
      }

      /* 2. Light Mode Variables */
      [data-theme="light"] {
        --main-bg-gradient-start: #ffcccc;
        --main-bg-gradient-end: #ffffff;
        --card-bg: #ffffff;
        --text-color: #212529;
        --theme-btn-color: #000000; 
        --shop-btn-bg: #000000;
        --shop-btn-text: #ffffff;
      }

      /* 3. Custom Styles */
      body {
        background: linear-gradient(to top, var(--main-bg-gradient-start), var(--main-bg-gradient-end));
        background-attachment: fixed;
        font-family: "Noto Sans", sans-serif;
        font-weight: 500;
        color: var(--text-color);
        transition: background 0.5s ease, color 0.3s ease;
        position: relative;
      }

      .theme-bg {
        background-color: var(--card-bg) !important;
        border: 1px solid var(--bs-danger);
        color: var(--text-color);
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      footer.theme-bg {
        border-top: 1px solid var(--bs-danger) !important;
      }

      h1, h2, h3, h4 {
        font-family: "Roboto Slab", serif;
        font-weight: 900;
      }

      .offcanvas-custom-gradient {
        background: linear-gradient(
          to right,
          var(--bs-danger),
          10%,
          var(--main-bg-gradient-end)
        );
      }

      .text-underline-danger {
        text-decoration: underline;
        text-decoration-color: var(--bs-danger);
        text-decoration-thickness: 3px;
      }

      .video-wrapper {
        border: 1px solid var(--bs-danger);
        border-radius: 0.5rem;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      }

      .offcanvas .nav-link.active {
        background-color: var(--bs-danger);
        color: white;
      }

      .offcanvas .nav-link:hover {
        background-color: #440606;
      }

      .main-content-width {
        width: 90%;
        margin-left: auto;
        margin-right: auto;
        max-width: 1400px;
      }

      [data-theme="light"] .text-white-50 {
        color: #6c757d !important;
      }
      
      .theme-toggle-btn {
        cursor: pointer;
        font-size: 1.5rem;
        color: var(--theme-btn-color);
        transition: color 0.3s ease;
      }
      .theme-toggle-btn:hover {
        color: var(--bs-danger) !important;
      }

      .btn-custom-shop {
        background-color: var(--shop-btn-bg);
        color: var(--shop-btn-text);
        border: 2px solid var(--bs-danger);
        font-weight: bold;
        transition: all 0.3s ease;
      }
      
      .btn-custom-shop:hover {
        background-color: var(--bs-danger);
        color: #ffffff;
        border-color: var(--bs-danger);
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      }

      /* Hover Effect */
      section[id^="game-"] {
        transition: transform 0.3s ease;
        padding: 20px;
        border-radius: 15px;
      }
      section[id^="game-"]:hover {
        background-color: rgba(255, 255, 255, 0.03);
      }

      /* Back to Top */
      #btn-back-to-top {
        position: fixed;
        bottom: 20px;
        right: 20px;
        display: none;
        z-index: 1000;
        background-color: var(--bs-danger);
        border: 2px solid white;
        color: white;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        font-size: 20px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        transition: all 0.3s;
      }
      #btn-back-to-top:hover {
        background-color: #ff0000;
        transform: scale(1.1);
      }

      /* CSS สำหรับดาวและ Tags */
      .star-rating {
        color: #ffc107;
        font-size: 1.2rem;
        margin-right: 10px;
      }
      .badge-genre {
        background-color: rgba(255, 255, 255, 0.1);
        border: 1px solid var(--bs-danger);
        color: var(--text-color);
        margin-right: 5px;
        font-weight: normal;
        font-size: 0.85rem;
      }
    </style>

    <script>
      // Logic เปลี่ยนธีม
      function toggleTheme() {
        const body = document.body;
        const icon = document.getElementById("themeIcon");
        const isLight = body.getAttribute("data-theme") === "light";
        
        if (isLight) {
            body.removeAttribute("data-theme");
            icon.classList.remove("fa-moon");
            icon.classList.add("fa-sun");
            document.querySelector(".navbar").classList.remove("navbar-light", "bg-light");
            document.querySelector(".navbar").classList.add("navbar-dark", "bg-dark");
        } else {
            body.setAttribute("data-theme", "light");
            icon.classList.remove("fa-sun");
            icon.classList.add("fa-moon");
            document.querySelector(".navbar").classList.remove("navbar-dark", "bg-dark");
            document.querySelector(".navbar").classList.add("navbar-light", "bg-light");
        }
      }

      // Logic ปุ่ม Back to Top
      let mybutton = document.getElementById("btn-back-to-top");
      window.onscroll = function () {
        scrollFunction();
      };
      function scrollFunction() {
        if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
          mybutton.style.display = "block";
        } else {
          mybutton.style.display = "none";
        }
      }
      mybutton.addEventListener("click", backToTop);
      function backToTop() {
        document.body.scrollTop = 0;
        document.documentElement.scrollTop = 0;
      }
    </script>

          ],
          steamUrl: 'https://store.steampowered.com/app/1222680/Need_for_Speed_Heat/',
        }
      ];

      // ฟังก์ชันแปลงคะแนนเป็น HTML ดาว ⭐
      function getStarHtml(scoreStr) {
        if (!scoreStr || scoreStr.includes("x")) return ""; 
        const score = parseFloat(scoreStr); 
        const maxScore = 10;
        let starsHtml = '<span class="star-rating">';
        const starCount = score / 2; 
        for (let i = 1; i <= 5; i++) {
            if (starCount >= i) {
                starsHtml += '<i class="fa-solid fa-star"></i>'; 
            } else if (starCount >= i - 0.5) {
                starsHtml += '<i class="fa-solid fa-star-half-stroke"></i>'; 
            } else {
                starsHtml += '<i class="fa-regular fa-star"></i>'; 
            }
        }
        starsHtml += '</span>';
        return starsHtml;
      }

      // ฟังก์ชันสร้างป้าย Tags
      function getTagsHtml(tags) {
          if(!tags) return "";
          return tags.map(tag => `<span class="badge rounded-pill badge-genre">${tag}</span>`).join("");
      }

      function renderGameList(filterText = "") {
        const container = document.getElementById("game-list-container");
        let allGamesHtml = "";
        let hasGame = false;

        gameData.forEach((game, index) => {
          const searchText = filterText.toLowerCase();
          const matchTitle = game.title.toLowerCase().includes(searchText);
          const matchTags = game.tags ? game.tags.some(tag => tag.toLowerCase().includes(searchText)) : false;

          if (filterText !== "" && !matchTitle && !matchTags) return;

          hasGame = true;
          const isVideoLeft = index % 2 === 0;
          const videoColOrder = isVideoLeft ? "" : "order-lg-2";
          const textColOrder = isVideoLeft ? "" : "order-lg-1";

          if (allGamesHtml !== "") {
            allGamesHtml += `<hr class="border-danger border-2 opacity-50 my-5" />`;
          }

          let shopButtonHtml = "";
          if (game.steamUrl && game.steamUrl.trim() !== "") {
            shopButtonHtml = `
            <a class="btn btn-lg btn-custom-shop" 
               href="${game.steamUrl}" 
               target="_blank" 
               rel="noopener noreferrer"
               title="สั่งซื้อเกมนี้บน Steam">
               <i class="fa-solid fa-shop"></i>
               <span class="d-none d-md-inline ms-2">สั่งซื้อเกมนี้</span>
            </a>
          `;
          }
          
          const iconHtml = game.iconUrl ? `<img src="${game.iconUrl}" alt="${game.title} icon" width="78" onerror="this.style.display='none'"/>` : '';

          const gameHtml = `
          <section id="game-${
            game.id
          }" class="row g-4 align-items-center my-4 pt-4">
            <div class="col-lg-6 ${videoColOrder}">
              <div class="ratio ratio-16x9 video-wrapper">
                <iframe
                  src="https://www.youtube.com/embed/${game.youtubeId}"
                  loading="lazy"
                  title="YouTube video player"
                  frameborder="0"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  allowfullscreen></iframe>
              </div>
            </div>
            <div class="col-lg-6 ${textColOrder}">
              <h2 class="display-6 text-center">
                ${game.title}
                ${iconHtml}
              </h2>
              
              <div class="text-center mb-3">
                 ${getTagsHtml(game.tags)}
              </div>

              <p class="fs-5">${game.description}</p>
              
              <div class="row mb-3">
                <div class="col-md-6">
                  <h5 class="text-success"><i class="fa-solid fa-circle-check"></i> จุดเด่น (Pros)</h5>
                  <ul class="fs-6">
                    ${game.pros.map((pro) => `<li>${pro}</li>`).join("")}
                  </ul>
                </div>
                <div class="col-md-6">
                  <h5 class="text-warning"><i class="fa-solid fa-circle-exclamation"></i> จุดด้อย (Cons)</h5>
                  <ul class="fs-6">
                    ${game.cons.map((con) => `<li>${con}</li>`).join("")}
                  </ul>
                </div>
              </div>
              <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
                 <div class="d-flex align-items-center">
                    ${getStarHtml(game.score)}
                    <h4 class="text-danger mb-0 fw-bold">คะแนน: ${game.score}</h4>
                 </div>
                 ${shopButtonHtml} 
              </div>
            </div>
          </section>
        `;

          allGamesHtml += gameHtml;
        });

        if (!hasGame) {
            container.innerHTML = `<div class="text-center py-5"><h3>ไม่พบเกมที่คุณค้นหา... 😅</h3></div>`;
        } else {
            container.innerHTML = allGamesHtml;
        }
      }

      function renderGameJumpList() {
        const listContainer = document.getElementById("game-jump-list");
        if (!listContainer) return;

        let listHtml = "";
        gameData.forEach((game) => {
          listHtml += `
          <li>
            <a class="dropdown-item" href="#game-${game.id}">
              ${game.title}
            </a>
          </li>
        `;
        });
        listContainer.innerHTML = listHtml;
      }
      
      document.addEventListener("DOMContentLoaded", () => {
        renderGameList();
        renderGameJumpList();
      });
    </script>
  </body>
</html>
